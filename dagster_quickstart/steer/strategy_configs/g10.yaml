# STEER StrategyConfig -- G10 (developed-market) universe.
#
# Currency pairs come from rewrite.data_api.dataset.fx.FXDevelopedMarkets
# (market_development=G10 in the datalake metadata) -- not listed here.
# G10 is one static Dagster partition, fetched independently of EM/CHN;
# every currency_pair in this universe is processed as data within that
# one partition run, not as a separate Dagster partition (see
# assets/steer/partitions.py). local_equity and
# interest_rate_differential/yield_curve_or_cds are discovered +
# availability-checked per pair (see steer/discovery.py);
# global_equity_series/commodity_series below are curated single series
# (global benchmarks, not per-pair) -- these two ARE real series_codes
# already in this catalog (IDX0005_INDEX, XAU_PX_0032), not placeholders.

universe: G10
ticker_source: bloomberg

# estimate_steer's rolling regression window.
window_months: 12

# |z-score| a pair must breach (AND pass cointegration) to get a BUY/SELL.
z_threshold: 1.5

# Reward:risk -- 2.0 means a 2:1 stop/target (see steer.signals.generate_signal).
stop_reward_ratio: 2.0

# Trailing realized-volatility cutoff (decimal, 0.01 == 1.00%) above which a
# pair is regressed in log-rate space instead of raw level.
logged_rate_threshold: 0.01
logged_rate_vol_window_days: 20

cointegration_significance: 0.05
min_observations: 60

# "Regional Index 5" -- a global equity-index series already ingested in
# this catalog. Swap for whatever real global benchmark you actually want
# (e.g. an MSCI World series) once one exists.
global_equity_series: IDX0005_INDEX

# "Gold Benchmark 32" -- a global commodity series already ingested.
commodity_series: XAU_PX_0032

# Economically-expected coefficient sign per driver (+1/-1); 0 = no
# expectation (never dropped by sign_check_and_reestimate).
expected_signs:
  interest_rate_differential: 1 # higher domestic rate -> currency appreciates
  yield_curve_or_cds: -1 # steeper curve (more expected future hikes priced out) -> currency depreciates
  local_equity: 1 # stronger local equities -> capital inflow -> appreciates
  global_equity: 1 # risk-on global equities -> pro-cyclical currency appreciates
  commodity: 1 # only meaningful for commodity-linked pairs; 0 it out per-pair if not applicable
