# STEER StrategyConfig -- EM universe.
#
# See g10.yaml's header comment -- same dataset-driven pair discovery
# (rewrite.data_api.dataset.fx.FXEmergingMarkets), same driver-sourcing
# rules, one static Dagster partition covering every EM pair as data.
# yield_curve_or_cds here is the non-USD leg's 5Y sovereign CDS *level*
# (this catalog has no EM sovereign-yield coverage, so there's no 3m/10y
# curve slope to build for EM the way G10 has) -- see
# steer/discovery.py's/steer/features.py's module docstrings for the full
# per-universe driver-construction rules.

universe: EM
ticker_source: bloomberg

# estimate_steer's rolling regression window -- shorter than G10's 12m
# since EM regimes/relationships shift faster.
window_months: 6

z_threshold: 1.5

# 1:1 for EM -- tighter reward:risk than G10 given higher EM volatility/gap risk.
stop_reward_ratio: 1.0

# EM pairs move more day-to-day than G10 -- a lower vol threshold (0.25% vs
# G10's 1.00%) means EM pairs switch into log-rate regression sooner.
logged_rate_threshold: 0.0025
logged_rate_vol_window_days: 20

cointegration_significance: 0.05
min_observations: 60

expected_signs:
  interest_rate_differential: 1
  yield_curve_or_cds: -1
  local_equity: 1
  global_equity: 1
  commodity: 1
