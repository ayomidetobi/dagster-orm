# STEER StrategyConfig -- CHN (CNY/CNH) universe.
#
# See g10.yaml's header comment. CNY is kept as its own universe (not
# folded into EM) since it's a managed/restricted currency with distinct
# regime dynamics -- rewrite.data_api.dataset.fx.FXChina.
#
# CHN's yield_curve_or_cds driver resolves to CNHCDS_PX_LAST, a SYNTHETIC
# PLACEHOLDER (is_synthetic=True in meta_series_steer.csv) -- the source
# ticker sheet supplies no CNH curve legs and no China CDS, so CHN taking
# the EM driver-2 treatment (non-USD leg's 5Y CDS level) is an assumption,
# not a confirmed spec. See steer/discovery.py's module docstring.
#
# drivers adds 2 CHN-specific columns on top of the 5 canonical ones:
#   - offshore_spread: the CNH-CNY basis (offshore - onshore 3M forward
#     points). No sign constraint below (see expected_signs) -- the
#     USDCNH specification note explicitly REMOVED the positivity
#     constraint on this coefficient.
#   - flows: regime-dependent (net HKEX buy/sell flows before 2024-08-16,
#     total turnover from that date -- see steer/features.py's
#     build_chn_flows). Net flows and total turnover are negatively
#     related (R^2=0.4484, negative slope per the spec note) -- the
#     coefficient's expected sign flips across the cutover, so it also
#     gets 0 rather than a fixed +1/-1 that would be wrong on one side of
#     the boundary.
drivers:
  - interest_rate_differential
  - yield_curve_or_cds
  - local_equity
  - global_equity
  - commodity
  - offshore_spread
  - flows

universe: CHN
ticker_source: bloomberg

# Shortest window of the three -- CNY regime shifts (PBOC policy changes,
# capital-control adjustments) tend to be the most abrupt.
window_months: 6

z_threshold: 1.5

# Tightest reward:risk of the three, matching EM's gap-risk logic but more so.
stop_reward_ratio: 1.0

logged_rate_threshold: 0.0025
logged_rate_vol_window_days: 20

# Tightened from the shared 0.05 default per the USDCNH specification note
# (5% -> 1%).
cointegration_significance: 0.01
min_observations: 60

expected_signs:
  interest_rate_differential: 1
  yield_curve_or_cds: -1
  local_equity: 1
  global_equity: 1
  commodity: 1
  # Positivity constraint explicitly removed by the USDCNH spec note -- 0
  # means "no expectation, never drop" (see
  # steer.estimation.sign_check_and_reestimate), which is the correct
  # encoding of "no constraint", not "expected zero effect".
  offshore_spread: 0
  # Sign flips across the 2024-08-16 regime cutover (see drivers comment
  # above) -- no single fixed sign is right on both sides.
  flows: 0
